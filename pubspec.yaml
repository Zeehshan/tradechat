name: tradechat
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.1 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
   # For images used
  flutter_svg: ^2.0.6


# For for validation
  formz: ^0.6.0

  # For condole messagews
  logger: ^1.3.0


    # sizes
  flutter_screenutil: ^5.8.2

    # locla storage
  flutter_secure_storage: ^8.0.0  

  # A Flutter plugin for iOS and Android for picking images 
# from the image library, and taking new pictures with the camera.
  image_picker: ^0.8.7+5

# A Flutter plugin for Android, iOS and Web supports cropping images.
# This plugin is based on three different native libraries so it comes
# with different UI between these platforms.
  image_cropper: ^4.0.1


  # A flutter library to show images from the internet and keep them in the cache directory.

  fwfh_cached_network_image: ^0.7.0+5

  intl: ^0.18.1

  get: ^4.6.5

  font_awesome_flutter: ^10.4.0

  dotted_border: ^2.0.0+3

  freezed_annotation: ^2.2.0
  json_annotation: ^4.8.1

  dio: ^5.2.1+1

 

dev_dependencies:
  flutter_test:
    sdk: flutter

  freezed: ^2.3.5
  build_runner: ^2.4.5
  json_serializable: ^6.7.0  


  flutter_lints: ^2.0.0

    # for app icon geeration
  flutter_launcher_icons: ^0.13.1



flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.jpeg" 

flutter:


  uses-material-design: true


  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Pubic Sans Bold
      fonts:
        - asset: assets/fonts/PublicSans-Bold.ttf
    - family: Pubic Sans Extra Bold
      fonts:
        - asset: assets/fonts/PublicSans-ExtraBold.ttf        
    - family: Pubic Sans Semi Bold
      fonts:
        - asset: assets/fonts/PublicSans-SemiBold.ttf     
    - family: Pubic Sans Regular
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf 
    - family: Pubic Sans Light
      fonts:
        - asset: assets/fonts/PublicSans-Light.ttf        
    - family: Pubic Sans Medium
      fonts:
        - asset: assets/fonts/PublicSans-Medium.ttf
